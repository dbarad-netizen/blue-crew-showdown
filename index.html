<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0d0716">
<title>Blue Crew Showdown — Dodgers Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1e; --card:#131c33; --card2:#182240; --line:rgba(163,178,225,.17);
    --ink:#ecf0fa; --muted:#93a0c0;
    --blue:#005A9C; --blue-bright:#4da3ff; --blue-mid:#0e69b0; --blue-dark:#04294a;
    --red:#ff5d61; --gold:#ffc84a; --gold-deep:#e3a812; --green:#3ecf8e;
    --disp:'Bebas Neue','Arial Narrow',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 90% 40% at 50% -5%, rgba(14,105,176,.3), transparent 60%),
      radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.3px);
    background-size:auto, 24px 24px; background-attachment:fixed; color:var(--ink);}
  body.october{background-image:
      radial-gradient(ellipse 90% 40% at 50% -5%, rgba(201,162,39,.22), transparent 60%),
      radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.3px);}
  header{background:linear-gradient(165deg,#021424 0%, var(--blue-dark) 35%, var(--blue) 78%, var(--blue-mid) 100%);
    color:#fff; padding:20px 16px 14px; text-align:center; position:relative; overflow:hidden;
    border-bottom:1px solid rgba(255,255,255,.12);}
  body.october header{background:linear-gradient(165deg,#0d0716 0%, #2a1240 40%, var(--blue-dark) 80%, var(--blue) 100%);}
  header::before{content:'⚾'; position:absolute; font-size:120px; opacity:.08; right:-20px; top:-24px; transform:rotate(14deg);}
  body.october header::before{content:'🏆';}
  header h1{margin:0; font-family:var(--disp); font-size:36px; letter-spacing:2.5px; font-weight:400; font-style:italic;
    text-shadow:0 4px 14px rgba(0,0,0,.5);}
  header h1 .accent{color:var(--gold);}
  header .sub{font-family:var(--disp); letter-spacing:4px; font-size:15px; color:var(--gold); margin-top:2px;}
  .roundstrip{display:flex; justify-content:center; gap:4px; margin:12px auto 0; max-width:420px; position:relative; z-index:1;}
  .rstep{flex:1; text-align:center; padding:7px 2px; border-radius:10px; border:1px solid var(--line);
    background:rgba(255,255,255,.05); font-size:11px; font-weight:800; color:var(--muted);}
  .rstep small{display:block; font-weight:600; font-size:9.5px; letter-spacing:.5px;}
  .rstep.done{color:var(--green); border-color:rgba(62,207,142,.4);}
  .rstep.live{background:linear-gradient(180deg, rgba(255,200,74,.25), rgba(227,168,18,.12)); color:var(--gold);
    border-color:rgba(255,200,74,.6); box-shadow:0 0 14px rgba(255,200,74,.25);}
  nav{display:flex; background:rgba(13,10,26,.92); backdrop-filter:blur(8px); position:sticky; top:0; z-index:10;
    border-bottom:1px solid var(--line); box-shadow:0 4px 18px rgba(0,0,0,.4);}
  nav button{flex:1; background:none; border:none; color:#8b93b8; padding:13px 2px 11px; font-family:var(--disp);
    font-size:clamp(13px,4vw,17px); letter-spacing:1px; white-space:nowrap; cursor:pointer; border-bottom:3px solid transparent;}
  nav button.active{color:#fff; border-bottom-color:var(--gold);}
  main{max-width:640px; margin:0 auto; padding:14px 12px 90px;}
  .card{background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:18px;
    padding:16px; margin-bottom:12px; box-shadow:0 6px 22px rgba(0,0,0,.4);}
  .card h2{margin:0 0 8px; font-family:var(--disp); font-size:22px; letter-spacing:1.2px; font-weight:400; color:#fff;}
  .muted{color:var(--muted); font-size:13px;}
  input[type=text]{width:100%; padding:12px 14px; border:2px solid var(--line); border-radius:12px; font-size:16px;
    background:#0b1226; color:var(--ink); outline-color:var(--blue-bright);}
  input::placeholder{color:#5c7a94;}
  .btn{display:inline-block; background:linear-gradient(180deg,#1d84d8,var(--blue)); color:#fff; border:none;
    border-radius:12px; padding:12px 20px; font-size:15px; font-weight:800; cursor:pointer; letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(29,132,216,.35), 0 3px 0 #033a63; transition:transform .08s;}
  .btn:active{transform:translateY(2px);}
  .btn:disabled{background:#2a4359; box-shadow:none; color:#7d97ac; cursor:not-allowed;}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep)); color:#241a02; box-shadow:0 4px 14px rgba(227,168,18,.35), 0 3px 0 #8a6408;}
  .btn.secondary{background:rgba(255,255,255,.06); color:var(--ink); border:1.5px solid var(--line); box-shadow:none;}
  .btn.small{padding:8px 14px; font-size:13px;}
  .row{display:flex; gap:8px; align-items:center;}
  .pill{display:inline-block; border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:800;}
  .pill.ok{background:rgba(62,207,142,.16); color:var(--green);}
  .pill.warn{background:rgba(255,93,97,.16); color:#ff9a9d;}
  .pill.gold{background:rgba(255,200,74,.16); color:var(--gold);}
  .budgetwrap{margin:12px 0 4px;}
  .budgetbar{height:16px; background:#0b1226; border-radius:8px; overflow:hidden; border:1px solid var(--line);}
  .budgetbar>div{height:100%; border-radius:7px;
    background:repeating-linear-gradient(45deg, #c9a227 0 12px, #e3a812 12px 24px);
    box-shadow:0 0 12px rgba(255,200,74,.45); transition:width .4s cubic-bezier(.2,.8,.3,1);}
  .budgetbar>div.hot{background:repeating-linear-gradient(45deg, #e5484d 0 12px, var(--red) 12px 24px);
    box-shadow:0 0 12px rgba(255,93,97,.5);}
  .capline{display:flex; justify-content:space-between; font-size:13px; margin-top:7px; color:var(--muted);}
  .bignum{font-family:var(--disp); font-size:21px; letter-spacing:.5px; color:var(--ink);}
  .ptable{width:100%; border-collapse:collapse; font-size:13.5px;}
  .ptable th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.9px;
    padding:6px 4px; border-bottom:2px solid var(--line);}
  .ptable td{padding:8px 4px; border-bottom:1px solid rgba(163,178,225,.08); vertical-align:middle;}
  .price{font-family:var(--disp); font-size:18px; letter-spacing:.5px; color:#7cc0ff; white-space:nowrap;}
  .pos{display:inline-block; background:rgba(77,163,255,.16); color:#9fceff; font-size:10px; font-weight:800;
    border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:1px;}
  .il{display:inline-block; background:rgba(255,93,97,.16); color:#ff9a9d; font-size:9.5px; font-weight:800;
    border-radius:6px; padding:2px 6px; margin-left:4px; vertical-align:1px;}
  .il.minors{background:rgba(167,139,250,.16); color:#c4b5fd;}
  .delta{font-size:10.5px; font-weight:800; margin-left:5px;}
  .delta.up{color:var(--red);} .delta.dn{color:var(--green);}
  .addbtn{background:linear-gradient(180deg,#1d84d8,var(--blue)); color:#fff; border:none; border-radius:50%;
    width:36px; height:36px; font-size:19px; font-weight:800; cursor:pointer; line-height:1;
    box-shadow:0 3px 10px rgba(29,132,216,.4);}
  .addbtn.remove{background:linear-gradient(180deg,#ff7376,#e5484d); box-shadow:0 3px 10px rgba(255,93,97,.35);}
  .addbtn:disabled{background:#2a4359; box-shadow:none; color:#7d97ac;}
  .hs{width:38px; height:38px; border-radius:50%; object-fit:cover; background:#0b1226;
    border:2px solid rgba(255,255,255,.15); flex-shrink:0; display:block;}
  .prow{display:flex; align-items:center; gap:10px;}
  .roster-chip{display:flex; justify-content:space-between; align-items:center; padding:8px 10px;
    background:rgba(255,255,255,.045); border:1px solid var(--line); border-radius:14px; margin-bottom:7px;
    font-size:14px; font-weight:600;}
  h3.tier{font-family:var(--disp); font-size:16px; letter-spacing:2px; color:var(--gold); margin:18px 0 4px; font-weight:400;
    border-bottom:1px solid var(--line); padding-bottom:4px;}
  .toggles{display:flex; gap:8px; margin-bottom:12px;}
  .tog{flex:1; text-align:center; padding:9px 6px; border-radius:12px; border:1.5px solid var(--line);
    background:rgba(255,255,255,.05); color:var(--muted); font-weight:800; font-size:13px; cursor:pointer;}
  .tog.on{background:linear-gradient(180deg, rgba(255,200,74,.25), rgba(227,168,18,.12)); color:var(--gold);
    border-color:rgba(255,200,74,.6);}
  .lb-item{border:1px solid var(--line); border-radius:18px; margin-bottom:12px; overflow:hidden;
    background:linear-gradient(180deg,var(--card2),var(--card)); box-shadow:0 6px 22px rgba(0,0,0,.4);
    animation:rise .4s cubic-bezier(.2,.8,.3,1) both;}
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  .lb-item.leader{border:1.5px solid rgba(255,200,74,.65); box-shadow:0 0 24px rgba(255,200,74,.2);}
  .lb-head{display:flex; align-items:center; gap:10px; padding:13px; cursor:pointer;}
  .avatar{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:21px; flex-shrink:0; border:2px solid rgba(255,255,255,.2);}
  .medal{font-size:24px; width:28px; text-align:center; flex-shrink:0;}
  .ranknum{font-family:var(--disp); font-size:18px; color:var(--muted); width:28px; text-align:center; flex-shrink:0;}
  .lb-name{font-weight:800; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:15px; color:#fff;}
  .rbreak{display:flex; gap:5px; margin-top:4px; flex-wrap:wrap;}
  .rchip{font-size:9.5px; font-weight:800; border-radius:6px; padding:2px 6px; background:rgba(255,255,255,.07);
    color:var(--muted); letter-spacing:.3px;}
  .rchip.live{background:rgba(255,200,74,.15); color:var(--gold);}
  .lb-pts{font-family:var(--disp); font-size:28px; letter-spacing:.5px; color:#fff; line-height:1;}
  .lb-today{font-size:11.5px; font-weight:700; text-align:right;}
  .lb-bar{height:6px; background:rgba(255,255,255,.06); margin:0 13px;}
  .lb-bar>div{height:100%; border-radius:0 4px 4px 0; background:linear-gradient(90deg,var(--gold-deep),var(--gold));
    box-shadow:0 0 10px rgba(255,200,74,.5); transition:width .7s cubic-bezier(.2,.8,.3,1);}
  .lb-item .lb-bar.blue>div{background:linear-gradient(90deg,var(--blue-mid),var(--blue-bright)); box-shadow:0 0 10px rgba(77,163,255,.5);}
  .lb-detail{padding:8px 13px 13px; display:none; background:rgba(0,0,0,.18); margin-top:9px; border-top:1px dashed var(--line);}
  .mvp{background:linear-gradient(135deg, rgba(255,200,74,.18), rgba(227,168,18,.08)); border:1.5px solid rgba(255,200,74,.5);
    border-radius:18px; padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:12px;
    box-shadow:0 0 22px rgba(255,200,74,.14);}
  .mvp .who b{font-size:15px; color:#fff;}
  .mvp .who span{display:block; font-size:10.5px; color:var(--gold); font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .mvp .pts{margin-left:auto; font-family:var(--disp); font-size:28px; color:var(--gold);}
  .finalbanner{background:linear-gradient(135deg, rgba(77,163,255,.16), rgba(14,105,176,.1)); border:1.5px solid rgba(77,163,255,.45);
    border-radius:18px; padding:12px 14px; margin-bottom:12px; text-align:center; font-weight:800; color:#9fceff;}
  .note{border:1px dashed rgba(255,200,74,.4); border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--gold);
    background:rgba(255,200,74,.06); margin-bottom:12px;}
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#eaf2fa; color:#0b1226;
    padding:11px 20px; border-radius:12px; font-size:14px; font-weight:700; z-index:99; max-width:90%; text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5);}
  .spin{text-align:center; padding:30px; color:var(--muted); font-weight:600;}
  .lockbadge{font-size:44px; text-align:center; display:block; margin:6px 0 2px;}
  .rules p{font-size:14px; line-height:1.65; margin:8px 0;}
  .rules table{width:100%; font-size:13px; border-collapse:collapse;}
  .rules td{padding:6px; border-bottom:1px solid rgba(163,178,225,.08);}
  footer{text-align:center; color:#54718a; font-size:12px; padding:12px 0 30px;}
  .capdock{position:fixed; bottom:0; left:0; right:0; z-index:20; background:rgba(13,10,26,.95); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-around; align-items:center; box-shadow:0 -6px 20px rgba(0,0,0,.45);}
  .capdock .lab{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; display:block; text-align:center;}
  .capdock .val{font-family:var(--disp); font-size:21px; text-align:center; display:block;}
</style>
</head>
<body>
<header>
  <h1>⚾ BLUE CREW <span class="accent">SHOWDOWN</span></h1>
  <div class="sub" id="subline">DODGERS REST-OF-SEASON LEAGUE</div>
  <div class="roundstrip" id="roundstrip"></div>
</header>
<nav>
  <button id="tab-squad" class="active" onclick="showTab('squad')">My Squad</button>
  <button id="tab-board" onclick="showTab('board')">Leaderboard</button>
  <button id="tab-players" onclick="showTab('players')">Players</button>
  <button id="tab-rules" onclick="showTab('rules')">Rules</button>
</nav>
<main>
  <section id="view-squad"></section>
  <section id="view-board" style="display:none"></section>
  <section id="view-players" style="display:none"></section>
  <section id="view-rules" style="display:none"></section>
  <footer>Built for the Blue Crew 💙 • real stats via MLB</footer>
</main>
<div id="capdock" style="display:none"></div>

<script>
const SB_URL = "https://xazmwpozsmbrqoulizyn.supabase.co/rest/v1";
const SB_KEY = "sb_publishable_nxpCXX6gQ8ZOWjFGdgFi3A_hcfOxoSY";
const PO_BUDGET = 100 * 0 + 80, PO_SIZE = 5, PO_MIN_P = 1, PO_MIN_H = 2;
const SEASON_START = "2026-07-30", SEASON_FINAL = "2026-09-27";   // regular-season archive window
let rounds = [], poPlayers = [], poPrices = [], managers = [], allPoPicks = [];
let me = null, myPicks = [];       // myPicks = player ids for the current draft round
let boardMode = 'october';
let ptsCache = {}, ptsCacheTime = {};
let seasonData = null;             // lazy: {players, picks, pts}

const $ = id => document.getElementById(id);
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function headshot(id, size){
  return `<img class="hs" ${size?`style="width:${size}px;height:${size}px"`:''} loading="lazy" alt=""
    src="https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_120,q_auto:best/v1/people/${id}/headshot/67/current">`;
}
const AVATARS = ['🧢','⚾','🔥','🐐','🚀','🎯','🦾','🌴','🏆','🎲','🦖','⭐'];
const AVA_BG  = ['#123a5e','#4a1d2e','#4a3a12','#12402b','#2f2354','#42122e','#0e3a52','#3a4212','#3f1c3a','#26364a','#0e4238','#4a3512'];
const RING_SVG = '<svg width="30" height="30" viewBox="0 0 64 64"><circle cx="32" cy="42" r="16" fill="none" stroke="#e3a812" stroke-width="9"/><circle cx="32" cy="42" r="16" fill="none" stroke="#ffd766" stroke-width="3"/><rect x="13" y="4" width="38" height="32" rx="9" fill="#0e4da0" stroke="#ffc84a" stroke-width="5"/><text x="32" y="28" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="17" font-weight="900" fill="#ffd766">LA</text><circle cx="21" cy="9.5" r="1.8" fill="#fff"/><circle cx="32" cy="8" r="1.8" fill="#fff"/><circle cx="43" cy="9.5" r="1.8" fill="#fff"/><circle cx="15.5" cy="20" r="1.8" fill="#fff"/><circle cx="48.5" cy="20" r="1.8" fill="#fff"/><circle cx="21" cy="30.5" r="1.8" fill="#fff"/><circle cx="43" cy="30.5" r="1.8" fill="#fff"/></svg>';
const AVATAR_OVERRIDES = { 'blow me':'🍆', 'eat me':'🍆', 'lick me':'🍆', 'db':RING_SVG };
function hashName(n){ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function avatarFor(n){
  const key = (n||'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
  const h = hashName(n||'?');
  return {emo: AVATAR_OVERRIDES[key] || AVATARS[h%AVATARS.length], bg:AVA_BG[(h>>4)%AVA_BG.length]};
}

async function sb(path, opts={}){
  const r = await fetch(SB_URL + path, { ...opts,
    headers: { "apikey": SB_KEY, "Authorization": "Bearer "+SB_KEY,
      "Content-Type": "application/json", "Prefer": "return=representation", ...(opts.headers||{}) } });
  if(!r.ok){ const t = await r.text(); throw new Error(r.status + " " + t); }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
function toast(msg, ms=2600){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), ms);
}
function countUp(el){
  const target = parseFloat(el.dataset.t||'0');
  if(!target){ el.textContent = target; return; }
  const dec = Math.abs(target % 1) > 0 ? 1 : 0, dur = 750, t0 = performance.now();
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = (target*e).toFixed(dec); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- rounds ---------- */
const nowMs = () => Date.now();
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function activeRounds(){ return rounds.filter(r=>r.active).sort((a,b)=>a.id-b.id); }
function draftRound(){ return activeRounds().find(r=>r.lock_at && new Date(r.lock_at).getTime() > nowMs()); }
function startedRounds(){ return activeRounds().filter(r=>r.start_date && r.start_date <= todayStr() && r.lock_at && new Date(r.lock_at).getTime() <= nowMs()); }
function liveRound(){ const t=todayStr(); return startedRounds().find(r=>!r.end_date || r.end_date >= t); }
function displayRound(){ const d=draftRound(); if(d) return d; const s=startedRounds(); return s.length? s[s.length-1] : null; }
function priceMap(roundId){ const m={}; poPrices.filter(p=>p.round_id===roundId).forEach(p=>m[p.player_id]=p.price); return m; }
function poPlayerById(id){ return poPlayers.find(p=>p.id===id); }
function fmtMult(m){ const n=parseFloat(m); return n===1?'':'×'+n; }
function fmtCountdown(ms){
  if(ms<=0) return 'locked';
  const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000);
  return d>0 ? `${d}d ${h}h` : (h>0 ? `${h}h ${m}m` : `${m}m`);
}
function octoberMode(){ return activeRounds().length > 0; }
function renderRoundStrip(){
  const el = $('roundstrip');
  if(!octoberMode()){ el.innerHTML=''; $('subline').textContent='DODGERS REST-OF-SEASON LEAGUE';
    document.body.classList.remove('october'); return; }
  $('subline').textContent = '— OCTOBER —';
  document.body.classList.add('october');
  const d = draftRound(), t = todayStr();
  el.innerHTML = rounds.sort((a,b)=>a.id-b.id).map(r=>{
    const done = r.active && r.end_date && r.end_date < t;
    const live = r.active && !done && r.lock_at && (new Date(r.lock_at).getTime()<=nowMs() || (d&&d.id===r.id));
    const cls = done?'done':(live?'live':'');
    const sub = !r.active ? (fmtMult(r.multiplier)||'×1') + ' • —'
      : done ? (fmtMult(r.multiplier)||'×1') + ' • final'
      : (d&&d.id===r.id) ? 'drafting 🟢'
      : (fmtMult(r.multiplier)||'×1') + ' • live';
    return `<div class="rstep ${cls}">${r.code}${done?' ✓':''}<small>${sub}</small></div>`;
  }).join('');
}

/* ---------- identity ---------- */
function loadMe(){ try{ return JSON.parse(localStorage.getItem('bcs_me')); }catch(e){ return null; } }
function saveMe(m){ localStorage.setItem('bcs_me', JSON.stringify(m)); me = m; }
async function resumeByName(){
  const name = $('join-name').value.trim();
  if(!name){ toast('Enter your manager name'); return; }
  try{
    const rows = await sb('/dodgers_managers?name=eq.'+encodeURIComponent(name));
    if(rows.length){ saveMe(rows[0]); await loadMyRoundPicks(); renderSquad(); toast('Welcome back, '+rows[0].name+'! 🧢'); }
    else toast('No manager by that name — the league is locked');
  }catch(e){ toast('Could not look that up — try again'); }
}

/* ---------- statuses ---------- */
let liveStatus = null, rosterSet = null;   // shared by October pool and season archive
async function refreshStatuses(){
  try{
    const r = await fetch('https://statsapi.mlb.com/api/v1/teams/119/roster?rosterType=40Man&season=2026');
    const j = await r.json();
    if(!j.roster || !j.roster.length) return;
    const map = { A:'Active', D10:'10-Day IL', D15:'15-Day IL', D60:'60-Day IL', D7:'7-Day IL', RM:'Minors', NYR:'Just traded' };
    liveStatus = {}; rosterSet = new Set();
    j.roster.forEach(e=>{ const id=e.person?.id; if(!id) return; rosterSet.add(id);
      liveStatus[id] = map[e.status?.code] || e.status?.description || 'Active'; });
    poPlayers.forEach(applyLiveStatus);
  }catch(e){}
}
function applyLiveStatus(p){
  if(rosterSet) p.status = rosterSet.has(p.id) ? (liveStatus[p.id]||'Active') : 'Off roster';
  return p;
}
function statusTag(p){
  if(!p || !p.status || p.status==='Active') return '';
  const cls = (p.status==='Minors'||p.status==='Off roster') ? 'il minors' : 'il';
  return `<span class="${cls}">${p.status}</span>`;
}

/* ---------- scoring ---------- */
function parseIP(ip){ if(!ip) return 0; const [w,f]=String(ip).split('.'); return (parseInt(w)||0)*3 + (parseInt(f)||0); }
function hitPts(s){
  const singles = (s.hits||0)-(s.doubles||0)-(s.triples||0)-(s.homeRuns||0);
  return singles*3 + (s.doubles||0)*5 + (s.triples||0)*8 + (s.homeRuns||0)*10
       + (s.runs||0)*2 + (s.rbi||0)*2 + (s.baseOnBalls||0)*2 + (s.hitByPitch||0)*2 + (s.stolenBases||0)*5;
}
function pitchPts(s){
  return parseIP(s.inningsPitched)*0.75 + (s.strikeOuts||0)*2 + (s.wins||0)*4
       + (s.saves||0)*8 + (s.holds||0)*4 - (s.earnedRuns||0)*2;
}
function fmtDate(d){ const [y,m,day]=d.split('-'); return `${m}/${day}/${y}`; }
function rangePoints(j){
  let pts = 0, detail = [];
  const seen = new Set();
  (j.stats||[]).forEach(g=>{
    const grp = g.group?.displayName;
    let splits = g.splits||[];
    const agg = splits.filter(sp=>!sp.team);
    if(agg.length) splits = agg;
    splits.forEach(sp=>{
      const s = sp.stat||{};
      const key = grp + JSON.stringify(s);
      if(seen.has(key)) return;
      seen.add(key);
      if(grp==='hitting' && (s.atBats||s.plateAppearances)){ pts+=hitPts(s); detail.push(`${s.homeRuns||0} HR, ${s.rbi||0} RBI, ${s.runs||0} R`); }
      if(grp==='pitching' && s.inningsPitched){ pts+=pitchPts(s); detail.push(`${s.inningsPitched} IP, ${s.strikeOuts||0} K, ${s.wins||0} W, ${s.saves||0} SV`); }
    });
  });
  return { pts: Math.round(pts*10)/10, detail: detail.join(' • ') };
}
async function fetchRange(id, start, end){
  const key = `${id}|${start}|${end}`;
  if(ptsCache[key] && nowMs()-ptsCacheTime[key] < 5*60*1000) return ptsCache[key];
  try{
    const r = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=byDateRange&group=hitting,pitching&startDate=${fmtDate(start)}&endDate=${fmtDate(end)}&season=2026`);
    const res = rangePoints(await r.json());
    ptsCache[key] = res; ptsCacheTime[key] = nowMs();
    return res;
  }catch(e){ return { pts:0, detail:'stats unavailable' }; }
}

/* ---------- picks & rollover ---------- */
function picksFor(mid, roundId){ return allPoPicks.filter(p=>p.manager_id===mid && p.round_id===roundId); }
function effectivePicks(mid, roundId){
  // A manager who misses a draft window rides their previous round's squad.
  const own = picksFor(mid, roundId);
  if(own.length) return { picks: own, rolled: false };
  const prior = activeRounds().filter(r=>r.id<roundId).sort((a,b)=>b.id-a.id);
  for(const r of prior){
    const p = picksFor(mid, r.id);
    if(p.length) return { picks: p, rolled: true };
  }
  return { picks: [], rolled: false };
}

/* ---------- squad ---------- */
function validatePoSquad(picks, pm){
  const errs = [];
  const spent = picks.reduce((s,id)=>s+(pm[id]||0),0);
  if(picks.length !== PO_SIZE) errs.push(`Pick exactly ${PO_SIZE} players (${picks.length} so far)`);
  if(spent > PO_BUDGET) errs.push(`Over budget by $${spent-PO_BUDGET}`);
  const cnt = role => picks.filter(id=>{ const p=poPlayerById(id); return p && (p.role===role || p.role==='twp'); }).length;
  if(cnt('pitcher') < PO_MIN_P) errs.push(`Need at least ${PO_MIN_P} pitcher`);
  if(cnt('hitter') < PO_MIN_H) errs.push(`Need at least ${PO_MIN_H} hitters`);
  return errs;
}

  return seasonData;
}

function renderPoMarket(d){
  const el = $('market'); if(!el) return;
  const pm = priceMap(d.id), prev = priceMap(d.id-1);
  const spent = myPicks.reduce((s,id)=>s+(pm[id]||0),0);
  const priced = poPlayers.filter(p=>pm[p.id]!=null);
  const tiers = [[22,999,'💎 SUPERSTARS'],[11,21,'⭐ STARS'],[6,10,'🔧 SOLID PIECES'],[0,5,'💰 BARGAIN BIN']];
  el.innerHTML = tiers.map(([lo,hi,label])=>{
    const rows = priced.filter(p=>pm[p.id]>=lo && pm[p.id]<=hi).sort((a,b)=>pm[b.id]-pm[a.id]).map(p=>{
      const owned = myPicks.includes(p.id);
      const cantAfford = !owned && (spent+pm[p.id] > PO_BUDGET || myPicks.length>=PO_SIZE);
      let delta = '';
      if(prev[p.id]!=null && prev[p.id]!==pm[p.id]){
        const df = pm[p.id]-prev[p.id];
        delta = `<span class="delta ${df>0?'up':'dn'}">${df>0?'▲':'▼'} $${Math.abs(df)}</span>`;
      }
      return `<tr><td><span class="prow">${headshot(p.id,34)}<span>${esc(p.name)}<span class="pos">${p.pos}</span>${statusTag(p)}${delta}</span></span></td>
        <td class="price">$${pm[p.id]}</td>
        <td style="text-align:right"><button class="addbtn ${owned?'remove':''}" ${cantAfford?'disabled':''}
          onclick="togglePo(${p.id})">${owned?'−':'+'}</button></td></tr>`;
    }).join('');
    return rows ? `<h3 class="tier">${label}</h3><table class="ptable"><tbody>${rows}</tbody></table>` : '';
  }).join('');
}
function togglePo(id){
  const d = draftRound(); if(!d) return;
  const pm = priceMap(d.id);
  if(myPicks.includes(id)) myPicks = myPicks.filter(x=>x!==id);
  else{
    if(myPicks.length>=PO_SIZE){ toast('Roster full — remove someone first'); return; }
    const spent = myPicks.reduce((s,x)=>s+(pm[x]||0),0);
    if(spent+(pm[id]||0) > PO_BUDGET){ toast("Can&#39;t afford that 💸"); return; }
    myPicks.push(id);
  }
  renderSquad();
}
async function savePoSquad(){
  const d = draftRound(); if(!me || !d) return;
  const pm = priceMap(d.id);
  const errs = validatePoSquad(myPicks, pm);
  if(errs.length){ toast(errs[0]); return; }
  try{
    await sb(`/dodgers_po_picks?manager_id=eq.${me.id}&round_id=eq.${d.id}`, { method:'DELETE' });
    await sb('/dodgers_po_picks', { method:'POST',
      body: JSON.stringify(myPicks.map(id=>({manager_id:me.id, round_id:d.id, player_id:id, price:pm[id]}))) });
    allPoPicks = allPoPicks.filter(p=>!(p.manager_id===me.id && p.round_id===d.id))
      .concat(myPicks.map(id=>({manager_id:me.id, round_id:d.id, player_id:id, price:pm[id]})));
    toast(`💾 ${d.code} squad saved — locks at first pitch!`);
  }catch(e){
    if(String(e).includes('403') || String(e).includes('row-level')) toast('That round is locked — first pitch has passed.');
    else toast('Save failed — try again');
  }
}

/* ---------- leaderboard ---------- */
async function computeOctober(){
  const started = startedRounds();
  const t = todayStr(), live = liveRound();
  const jobs = [];   // {mid, round, playerId}
  const perRound = {}; // roundId -> Set(playerIds)
  managers.forEach(m=>{
    started.forEach(r=>{
      const eff = effectivePicks(m.id, r.id);
      eff.picks.forEach(p=>{ (perRound[r.id] = perRound[r.id] || new Set()).add(p.player_id); });
    });
  });
  const ranges = {};   // roundId -> [start, end]
  started.forEach(r=>{ ranges[r.id] = [r.start_date, (r.end_date && r.end_date < t) ? r.end_date : t]; });
  const results = {};  // `${roundId}|${playerId}` -> {pts, detail}
  const fetches = [];
  Object.entries(perRound).forEach(([rid, set])=>{
    set.forEach(pid=>fetches.push((async ()=>{
      results[`${rid}|${pid}`] = await fetchRange(pid, ranges[rid][0], ranges[rid][1]);
    })()));
  });
  // today's points for live round players
  const todayPts = {};
  if(live && perRound[live.id]){
    [...perRound[live.id]].forEach(pid=>fetches.push((async ()=>{
      todayPts[pid] = (await fetchRange(pid, t, t)).pts;
    })()));
  }
  await Promise.all(fetches);
  const rows = managers.map(m=>{
    let total = 0, dayTotal = 0;
    const roundBreak = [];
    started.forEach(r=>{
      const eff = effectivePicks(m.id, r.id);
      const raw = eff.picks.reduce((s,p)=>s+(results[`${r.id}|${p.player_id}`]?.pts||0),0);
      total += raw * parseFloat(r.multiplier);
      if(live && r.id===live.id) dayTotal = eff.picks.reduce((s,p)=>s+(todayPts[p.player_id]||0),0);
      roundBreak.push({ r, raw: Math.round(raw*10)/10, rolled: eff.rolled, picks: eff.picks });
    });
    return { m, total: Math.round(total*10)/10, dayTotal: Math.round(dayTotal*10)/10, roundBreak };
  }).sort((a,b)=>b.total-a.total);
  return { rows, results, todayPts, live };
}
function fmtToday(t){
  if(!t) return '<span class="muted">—</span>';
  const col = t>0 ? 'var(--green)' : 'var(--red)';
  const fire = t>=15 ? ' 🔥' : '';
  return `<span style="color:${col};font-weight:800">${t>0?'+':''}${t}</span>${fire}`;
}

              <div class="lb-today">${r.dayTotal ? fmtToday(r.dayTotal)+' today' : '<span class="muted">— today</span>'}</div></div>
          </div>
          <div class="lb-bar ${i===0?'':'blue'}"><div style="width:${(r.total/max)*100}%"></div></div>
          <div class="lb-detail">${detail}</div>
        </div>`;
      }).join('') +
      `<p class="muted" style="text-align:center">Running October total • NLCS ×1.5 • World Series ×2 • ↩ = rolled-over squad<br>
      <button class="btn secondary small" style="margin-top:8px" onclick="ptsCache={};renderBoard()">↻ Refresh</button></p>`;
    v.querySelectorAll('.lb-pts').forEach(countUp);
  }catch(e){ v.innerHTML = toggles + `<div class="card"><p class="muted">Couldn&#39;t load the leaderboard (${esc(e.message)}). Try again in a moment.</p></div>`; }
}

/* ---------- regular-season archive ---------- */
async function renderSeasonBoard(toggles){
  const v = $('view-board');
  const t = todayStr();
  const seasonOver = t > SEASON_FINAL;
  v.innerHTML = toggles + `<div class="spin">${seasonOver?'Loading the final regular-season standings… 🏁':'Crunching real MLB stats… ⚾'}</div>`;
  try{
    if(!seasonData){
      const [players, mgrs, picks] = await Promise.all([
        sb('/dodgers_players?select=*'), sb('/dodgers_managers?order=created_at'), sb('/dodgers_picks')
      ]);
      seasonData = { players, mgrs, picks };
    }
    const { players, mgrs, picks } = seasonData;
    const end = seasonOver ? SEASON_FINAL : t;
    const ids = [...new Set(picks.map(p=>p.player_id))];
    const pts = {}, todayPts = {};
    await Promise.all(ids.map(async id=>{
      pts[id] = await fetchRange(id, SEASON_START, end);
      if(!seasonOver) todayPts[id] = (await fetchRange(id, t, t)).pts;
    }));
    const pById = id => players.find(p=>p.id===id);
    const rows = mgrs.map(m=>{
      const mine = picks.filter(p=>p.manager_id===m.id);
      const total = mine.reduce((s,p)=>s+(pts[p.player_id]?.pts||0),0);
      const dayTotal = seasonOver ? 0 : mine.reduce((s,p)=>s+(todayPts[p.player_id]||0),0);
      return { m, mine, total: Math.round(total*10)/10, dayTotal: Math.round(dayTotal*10)/10 };
    }).sort((a,b)=>b.total-a.total);
    const max = Math.max(1, ...rows.map(r=>r.total));
    const medals = ['🥇','🥈','🥉'];
    const daysLeft = Math.max(0, Math.ceil((new Date(SEASON_FINAL+'T23:59:59') - new Date())/86400000));
    v.innerHTML = toggles +
      (seasonOver
        ? `<div class="finalbanner">🏁 REGULAR SEASON — FINAL &nbsp;•&nbsp; Jul 30 – Sep 27, 2026</div>`
        : `<div class="finalbanner">⚾ REGULAR SEASON — LIVE &nbsp;•&nbsp; ${daysLeft} day${daysLeft===1?'':'s'} to the finish line (Sep 27)</div>`) +
      rows.map((r,i)=>{
        const av = avatarFor(r.m.name);
        const hot = !seasonOver && r.dayTotal>=25 ? ' 🔥' : '';
        return `
        <div class="lb-item ${i===0?'leader':''}" style="animation-delay:${i*70}ms">
          <div class="lb-head" onclick="this.parentNode.querySelector('.lb-detail').style.display = this.parentNode.querySelector('.lb-detail').style.display==='block'?'none':'block'">
            ${i<3 ? `<div class="medal">${medals[i]}</div>` : `<div class="ranknum">${i+1}</div>`}
            <div class="avatar" style="background:${av.bg}">${av.emo}</div>
            <div class="lb-name">${i===0?(seasonOver?'🏆 ':'👑 '):''}${esc(r.m.name)}${hot}<span style="display:block;font-size:11px;font-weight:600;color:var(--muted)">${i===0?(seasonOver?'REGULAR SEASON CHAMPION':'leading the race'):(seasonOver?'final':'chasing')}</span></div>
            <div style="text-align:right"><div class="lb-pts" data-t="${r.total}">0</div>
              ${seasonOver?'':`<div class="lb-today">${r.dayTotal ? fmtToday(r.dayTotal)+' today' : '<span class="muted">— today</span>'}</div>`}</div>
          </div>
          <div class="lb-bar ${i===0?'':'blue'}"><div style="width:${(r.total/max)*100}%"></div></div>
          <div class="lb-detail">
            ${r.mine.length ? `<table class="ptable"><tbody>${ r.mine
              .map(p=>({p, pl:pById(p.player_id), pp:pts[p.player_id]}))
              .sort((a,b)=>(b.pp?.pts||0)-(a.pp?.pts||0))
              .map(({p,pl,pp})=>`<tr><td><span class="prow">${headshot(p.player_id,34)}<span>${esc(pl?.name||p.player_id)}<span class="pos">${pl?.pos||''}</span><br>
                <span class="muted" style="font-size:11px">${pp?.detail||''}</span></span></span></td>
                ${seasonOver?'':`<td style="text-align:right">${fmtToday(todayPts[p.player_id])}</td>`}
                <td class="price" style="text-align:right">${pp?.pts??0}</td></tr>`).join('') }</tbody></table>`
            : '<p class="muted">No players drafted.</p>'}
          </div>
        </div>`;
      }).join('') +
      (seasonOver
        ? `<p class="muted" style="text-align:center">The banner hangs forever. October is a new race. 🏆</p>`
        : `<p class="muted" style="text-align:center">Points from real games since Jul 30 • final standings lock Sep 27<br>
           <button class="btn secondary small" style="margin-top:8px" onclick="ptsCache={};renderBoard()">↻ Refresh</button></p>`);
    v.querySelectorAll('.lb-pts').forEach(countUp);
  }catch(e){ v.innerHTML = toggles + `<div class="card"><p class="muted">Couldn&#39;t load the season standings (${esc(e.message)}).</p></div>`; }
}

/* ---------- players tab ---------- */
async function renderPlayers(){
  const v = $('view-players');
  const disp = displayRound() || draftRound();
  if(!disp){ await renderSeasonPlayers(v); return; }
  const pm = priceMap(disp.id), prev = priceMap(disp.id-1);
  const priced = poPlayers.filter(p=>pm[p.id]!=null);
  if(!priced.length){
    v.innerHTML = `<div class="card" style="text-align:center"><p class="muted">💰 ${esc(disp.code)} prices drop soon — check back.</p></div>`;
    return;
  }
  const started = disp.start_date && disp.start_date <= todayStr() && new Date(disp.lock_at).getTime() <= nowMs();
  v.innerHTML = '<div class="spin">Loading player board… 🧮</div>';
  const pts = {};
  if(started){
    const t = todayStr(), end = (disp.end_date && disp.end_date < t) ? disp.end_date : t;
    await Promise.all(priced.map(async p=>{ pts[p.id] = await fetchRange(p.id, disp.start_date, end); }));
  }
  const sorted = [...priced].sort((a,b)=>(pts[b.id]?.pts||0)-(pts[a.id]?.pts||0) || pm[b.id]-pm[a.id]);
  v.innerHTML = `<div class="card"><h2>📊 ${esc(disp.code)} Player Board</h2>
    <p class="muted">${started ? 'Round points vs. price — find the October heroes.' : 'The re-priced market for this round. ▲▼ vs last round.'}</p>
    <table class="ptable"><thead><tr><th>Player</th><th>Cost</th>${started?'<th style="text-align:right">Round pts</th>':''}</tr></thead><tbody>
    ${sorted.map(p=>{
      let delta = '';
      if(prev[p.id]!=null && prev[p.id]!==pm[p.id]){
        const df = pm[p.id]-prev[p.id];
        delta = `<span class="delta ${df>0?'up':'dn'}">${df>0?'▲':'▼'} $${Math.abs(df)}</span>`;
      }
      return `<tr><td><span class="prow">${headshot(p.id,34)}<span>${esc(p.name)}<span class="pos">${p.pos}</span>${statusTag(p)}${delta}</span></span></td>
      <td class="price">$${pm[p.id]}</td>${started?`<td style="text-align:right;font-weight:800">${pts[p.id]?.pts??0}</td>`:''}</tr>`;
    }).join('')}
    </tbody></table></div>`;
}

/* ---------- regular-season player board (pre-October) ---------- */
async function renderSeasonPlayers(v){
  v.innerHTML = '<div class="spin">Loading player board… 🧮</div>';
  try{
    const t = todayStr(), seasonOver = t > SEASON_FINAL;
    const end = seasonOver ? SEASON_FINAL : t;
    const { players } = await loadSeasonCore();
    players.forEach(applyLiveStatus);
    const pts = {}, todayPts = {};
    await Promise.all(players.map(async p=>{
      pts[p.id] = await fetchRange(p.id, SEASON_START, end);
      if(!seasonOver) todayPts[p.id] = (await fetchRange(p.id, t, t)).pts;
    }));
    const sorted = [...players].sort((a,b)=>(pts[b.id]?.pts||0)-(pts[a.id]?.pts||0) || (b.price||0)-(a.price||0));
    v.innerHTML = `<div class="card"><h2>📊 Player Board</h2>
      <p class="muted">${seasonOver ? 'Final regular-season points vs. what they cost.' : 'Rest-of-season points vs. what they cost. Find the steals.'}</p>
      <table class="ptable"><thead><tr><th>Player</th><th>Cost</th>${seasonOver?'':'<th style="text-align:right">Today</th>'}<th style="text-align:right">Total</th></tr></thead><tbody>
      ${sorted.map(p=>{
        const val = pts[p.id]?.pts && p.price ? (pts[p.id].pts/p.price).toFixed(1) : null;
        return `<tr><td><span class="prow">${headshot(p.id,34)}<span>${esc(p.name)}<span class="pos">${p.pos}</span>${statusTag(p)}
          ${val ? `<br><span class="muted" style="font-size:10.5px;font-weight:600">${val} pts per $</span>` : ''}</span></span></td>
        <td class="price">$${p.price??0}</td>${seasonOver?'':`<td style="text-align:right">${fmtToday(todayPts[p.id])}</td>`}
        <td style="text-align:right;font-weight:800">${pts[p.id]?.pts??0}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  }catch(e){ v.innerHTML = `<div class="card"><p class="muted">Couldn&#39;t load the player board (${esc(e.message)}).</p></div>`; }
}

/* ---------- rules ---------- */
function scoringTables(){
  return `
    <h2 style="margin-top:16px">🏏 Hitter Scoring</h2>
    <table><tr><td>Single</td><td><b>+3</b></td><td>Double</td><td><b>+5</b></td></tr>
    <tr><td>Triple</td><td><b>+8</b></td><td>Home run</td><td><b>+10</b></td></tr>
    <tr><td>Run</td><td><b>+2</b></td><td>RBI</td><td><b>+2</b></td></tr>
    <tr><td>Walk / HBP</td><td><b>+2</b></td><td>Stolen base</td><td><b>+5</b></td></tr></table>
    <h2 style="margin-top:16px">🎯 Pitcher Scoring</h2>
    <table><tr><td>Out recorded</td><td><b>+0.75</b></td><td>Strikeout</td><td><b>+2</b></td></tr>
    <tr><td>Win</td><td><b>+4</b></td><td>Save</td><td><b>+8</b></td></tr>
    <tr><td>Hold</td><td><b>+4</b></td><td>Earned run</td><td><b>−2</b></td></tr></table>`;
}
function seasonRulesCard(){
  return `
  <div class="card rules">
    <h2>📖 Regular Season — How It Works</h2>
    <p>Everyone got <b>$100</b> to buy a squad of <b>6 Dodgers</b> — at least 2 pitchers and 2 hitters (Ohtani counts as both). Better players cost more, so building a winner meant finding value. Multiple managers can own the same player.</p>
    <p>The league is <b>locked 🔒</b> — all squads are final and no new managers can join. Points come from real MLB games from <b>July 30 through September 27</b>. Highest total wins. 🏆</p>
    ${scoringTables()}
    <p class="muted" style="margin-top:12px">IL/roster tags update live from MLB every time the page loads. 🔥 = 15+ points today.</p>
  </div>`;
}
function octoberRulesCard(open){
  return `
  <div class="card rules">
    <h2>🏆 ${open ? 'October Format' : 'Coming in October — the Playoff Edition'}</h2>
    ${open ? '' : '<p class="muted">A preview of what happens if the Dodgers punch their ticket. Registration opens when the postseason schedule is set.</p>'}
    <p>Fresh draft every playoff round: <b>$${PO_BUDGET}, ${PO_SIZE} players</b> (at least ${PO_MIN_P} pitcher and ${PO_MIN_H} hitters — Ohtani counts as both). The market is <b>re-priced each round</b> on current form — October heroes get expensive, cold bats get cheap.</p>
    <p>Each round&#39;s draft window opens when the series is set and <b>locks automatically at first pitch of Game 1</b>. Miss the window and your previous round&#39;s squad rides again (↩). Save as many times as you like before the lock.</p>
    <p>Round points scale: <b style="color:var(--gold)">Wild Card ×1 • NLDS ×1 • NLCS ×1.5 • World Series ×2</b>. One running October total crowns the champion when the run ends. Same scoring as the regular season${open ? '' : ' (below)'}. The trade-deadline arms — yes, including Skubal — join the player pool.</p>
    ${open ? scoringTables() : ''}
    ${open ? '<p class="muted" style="margin-top:12px">The regular-season final standings live forever under Leaderboard → 🏁 Regular Season.</p>' : ''}
  </div>`;
}
function renderRules(){
  $('view-rules').innerHTML = octoberMode()
    ? octoberRulesCard(true) + seasonRulesCard()
    : seasonRulesCard() + octoberRulesCard(false);
}

/* ---------- boot ---------- */
(async function(){
  renderRules();
  try{
    [rounds, poPlayers, poPrices, managers, allPoPicks] = await Promise.all([
      sb('/dodgers_po_rounds?select=*'),
      sb('/dodgers_po_players?select=*'),
      sb('/dodgers_po_prices?select=*'),
      sb('/dodgers_managers?order=created_at'),
      sb('/dodgers_po_picks?select=*'),
    ]);
    poPlayers.forEach(p=>p.status='Active');
    await refreshStatuses();
  }catch(e){
    $('view-squad').innerHTML = `<div class="card"><p class="muted">Couldn&#39;t reach the league database. Check your connection and refresh.</p></div>`;
    return;
  }
  renderRoundStrip();
  renderRules();   // re-render now that we know whether October is open
  // Until October actually starts, the leaderboard defaults to the live regular-season race.
  if(!startedRounds().length && !draftRound()) boardMode = 'season';
  me = loadMe();
  if(me){
    try{
      const fresh = await sb('/dodgers_managers?id=eq.'+me.id);
      if(fresh.length){ me = fresh[0]; localStorage.setItem('bcs_me', JSON.stringify(me)); await loadMyRoundPicks(); }
      else { me = null; localStorage.removeItem('bcs_me'); }
    }catch(e){}
  }
  renderSquad();
  setInterval(()=>{ updateCapdock(document.querySelector('nav .active')?.id?.replace('tab-','')); }, 60000);
})();
</script>
